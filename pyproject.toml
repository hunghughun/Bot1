[project]
name = "bot1-offline"
version = "0.1.0"
description = "Offline, read-only account-monitoring core; synthetic transports only"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bot1 = "bot1.cli:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
